name: Verify published FokoLab 80.2
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - README.md
      - .github/workflows/verify-live-802.yml
permissions:
  contents: read
  pages: read
concurrency:
  group: fokolab-802-live
  cancel-in-progress: true
jobs:
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check the actual published files against this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from pathlib import Path
          import concurrent.futures,hashlib,json,os,time,urllib.request
          out=Path('evidence/live-80.2');out.mkdir(parents=True,exist_ok=True)
          base='https://chilperic.github.io/chilperic_ode_solver/'
          report={'release':'80.2.0','commit':os.environ['GITHUB_SHA'],'checkedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'attempts':[]}
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'FokoLab-release-verification/80.2','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:return r.status,r.read(25000000),r.headers.get('Content-Type','')
          try:
              req=urllib.request.Request('https://api.github.com/repos/chilperic/chilperic_ode_solver/pages',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=20) as r:settings=json.load(r)
              report['pagesSettings']={k:settings.get(k) for k in ('status','html_url','build_type','source')}
          except Exception as e:report['pagesSettingsError']=str(e)
          expected=hashlib.sha256(Path('site/VERSION.json').read_bytes()).hexdigest();prefix=None
          for attempt in range(25):
              for sub in ('site/','','docs/'):
                  url=base+sub+'VERSION.json?release-check='+os.environ['GITHUB_SHA']+'&attempt='+str(attempt)
                  try:
                      status,data,mime=get(url);v=json.loads(data);sha=hashlib.sha256(data).hexdigest()
                      report['attempts'].append({'url':url,'version':v.get('version'),'exact':sha==expected})
                      if v.get('version')=='80.2.0' and sha==expected:prefix=base+sub;break
                  except Exception as e:report['attempts'].append({'url':url,'error':str(e)})
              if prefix:break
              time.sleep(12)
          report['publishedBase']=prefix
          if prefix:
              paths=['index.html','analysis-studio.html','VERSION.json','CITATION.cff','contributors.html','contributors.json','styles/analysis-studio.css','styles/revision82.css','src/integration/registry.js','src/upgrade/common.js','plants/index.html','plants/worker.js','plants/plant-renderer.js','plants/water-circuit.js','leaf/index.html','leaf/worker.js','leaf/diagnostic-worker.js','shared/leaf-diagnostics.js','design/leaf-diagnostic-ui.js','tcells/index.html','tcells/worker.js','tcells/tcell-engine.js','lipids/index.html','lipids/worker.js','lipids/lipid-engine.js','continuum/advanced.html','continuum/advanced-engine.js','random.html','engine.js','ode.html','statistics.html','book.html','cv.html','cv/downloads.json','cv/README.md','deployment-verification.json']
              paths += ['src/analysis-studio/'+p for p in ('statistics.mjs','compute.mjs','methods.mjs','demos.mjs','plots.mjs','explain.mjs','ui.mjs','worker.mjs','reproduce.py')]
              paths += ['src/revision82/'+p for p in ('analysis-bridge.js','run-integrity.js','contributors.js','interface.js')]
              paths += ['cv/'+e['id']+'.pdf' for e in json.loads(Path('site/cv/downloads.json').read_text())['editions']]
              def check(path):
                  try:
                      status,data,mime=get(prefix+path+'?release-check='+os.environ['GITHUB_SHA'])
                      expected=hashlib.sha256((Path('site')/path).read_bytes()).hexdigest();actual=hashlib.sha256(data).hexdigest()
                      javascriptOK=not path.endswith('.mjs') or any(x in mime for x in ('javascript','ecmascript'))
                      return {'path':path,'http':status,'mime':mime,'expectedSHA256':expected,'publishedSHA256':actual,'passed':actual==expected and javascriptOK}
                  except Exception as e:return {'path':path,'passed':False,'error':str(e)}
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:report['checks']=list(ex.map(check,paths))
              try:report['rootHTTP']=get(base)[0]
              except Exception as e:report['rootError']=str(e)
          report['passed']=bool(prefix) and report.get('rootHTTP')==200 and all(c['passed'] for c in report.get('checks',[]))
          (out/'published-hashes.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k not in ('checks','attempts')},indent=2))
          assert report['passed'],'Published 80.2 files did not match this commit; see artifact.'
      - name: Install browser for public-site smoke test
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Exercise the live module worker and plot
        shell: python
        run: |
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          out=Path('evidence/live-80.2');report=json.loads((out/'published-hashes.json').read_text())
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1000},reduced_motion='reduce');errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              response=page.goto(report['publishedBase']+'analysis-studio.html',wait_until='domcontentloaded',timeout=45000)
              assert response.status==200
              page.wait_for_function('!!window.FokoAnalysisStudio',timeout=45000)
              page.locator('#as-run').click();page.wait_for_function("window.FokoAnalysisResult?.method==='welch-anova'",timeout=45000)
              page.wait_for_function("!!document.getElementById('as-plot-left')._fullLayout",timeout=30000)
              assert not page.locator('#as-error').is_visible() and not errors,errors
              page.screenshot(path=str(out/'published-analysis-studio.png'),full_page=True)
              observed=page.evaluate('({method:FokoAnalysisResult.method,version:FokoAnalysisResult.version,units:FokoAnalysisResult.audit.analyzedUnits})')
              assert observed['version']=='80.2.0'
              (out/'live-browser.json').write_text(json.dumps({'passed':True,'observed':observed,'pageErrors':errors,'scope':'Live default module-worker and plot smoke test; broader acceptance in deployment-verification.json.'},indent=2))
              browser.close();print('LIVE_BROWSER_OK',observed)
      - name: Retain served-byte and live-browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fokolab-802-live-verification
          path: evidence/live-80.2/
          retention-days: 30
