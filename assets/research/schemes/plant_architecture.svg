<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Thermo-hydraulic photosynthesis architecture</title><desc id="desc">Environmental inputs drive leaf physics and hydraulics, which determine biochemistry, assimilation, analysis and trait search.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#27364a"/></marker><style>.box{fill:#f8fbff;stroke:#27364a;stroke-width:2.2;rx:18}.blue{fill:#eaf3ff}.green{fill:#eef8e8}.orange{fill:#fff4e3}.text{font:700 18px Inter,Arial,sans-serif;fill:#111827}.small{font:500 12.5px Inter,Arial,sans-serif;fill:#466}.arrow{stroke:#27364a;stroke-width:2.6;fill:none;marker-end:url(#arrow)}.tag{font:700 12px Inter,Arial,sans-serif;fill:#0f766e}</style></defs><text class="tag" x="24" y="26">mechanism-first: environment → physics → biology → evolution</text><rect class="box blue" x="24" y="70" width="135" height="94" rx="16"/><text class="text" x="91" y="108" text-anchor="middle">Climate</text><text class="small" x="91" y="132" text-anchor="middle">irradiance · air</text><text class="small" x="91" y="150" text-anchor="middle">humidity · soil</text><rect class="box green" x="214" y="45" width="160" height="126" rx="18"/><text class="text" x="294" y="84" text-anchor="middle">Leaf physics</text><text class="small" x="294" y="108" text-anchor="middle">radiation partition</text><text class="small" x="294" y="127" text-anchor="middle">Tmes / Tbs balance</text><text class="small" x="294" y="146" text-anchor="middle">heat fluxes</text><rect class="box orange" x="214" y="246" width="160" height="108" rx="18"/><text class="text" x="294" y="287" text-anchor="middle">Hydraulics</text><text class="small" x="294" y="312" text-anchor="middle">water uptake</text><text class="small" x="294" y="331" text-anchor="middle">stomatal cooling</text><rect class="box green" x="430" y="65" width="140" height="106" rx="18"/><text class="text" x="500" y="106" text-anchor="middle">Biochemistry</text><text class="small" x="500" y="130" text-anchor="middle">Rubisco · PEPC</text><text class="small" x="500" y="149" text-anchor="middle">C3/C4 continuum</text><rect class="box" x="430" y="248" width="140" height="96" rx="18"/><text class="text" x="500" y="286" text-anchor="middle">Assimilation</text><text class="small" x="500" y="311" text-anchor="middle">Ames · Abs · total A</text><rect class="box blue" x="620" y="66" width="116" height="104" rx="18"/><text class="text" x="678" y="104" text-anchor="middle">Analysis</text><text class="small" x="678" y="128" text-anchor="middle">Sobol · Pareto</text><text class="small" x="678" y="147" text-anchor="middle">3D evolution</text><rect class="box orange" x="620" y="248" width="116" height="96" rx="18"/><text class="text" x="678" y="286" text-anchor="middle">Trait search</text><text class="small" x="678" y="311" text-anchor="middle">CMA-ES routes</text><path class="arrow" d="M159 117 H211"/><path class="arrow" d="M374 106 H427"/><path class="arrow" d="M374 300 H427"/><path class="arrow" d="M500 171 V244"/><path class="arrow" d="M570 118 H617"/><path class="arrow" d="M570 296 H617"/><path class="arrow" d="M294 173 V242"/><path class="arrow" d="M376 300 C410 300 402 119 427 119"/></svg>