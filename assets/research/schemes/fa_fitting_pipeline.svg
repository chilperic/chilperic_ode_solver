<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-labelledby="title desc"><title id="title">Fatty-acid fitting pipeline</title><desc id="desc">Time-course data are represented by an ODE model, fitted with least squares, then interpreted for substrate dependence.</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker><style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2.5;rx:18}.t{font:700 19px Inter,Arial,sans-serif;fill:#111827}.s{font:500 13px Inter,Arial,sans-serif;fill:#475569}.arr{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.line{stroke:#0f766e;stroke-width:3;fill:none}.pt{fill:#0f766e}</style></defs><rect class="b" x="28" y="70" width="150" height="104" rx="18"/><text class="t" x="103" y="107" text-anchor="middle">Time-course</text><text class="s" x="103" y="132" text-anchor="middle">C14/C16/C18</text><text class="s" x="103" y="150" text-anchor="middle">data</text><rect class="b" x="246" y="70" width="150" height="104" rx="18"/><text class="t" x="321" y="107" text-anchor="middle">ODE model</text><text class="s" x="321" y="132" text-anchor="middle">mass-action</text><text class="s" x="321" y="150" text-anchor="middle">kinetics</text><rect class="b" x="464" y="70" width="150" height="104" rx="18"/><text class="t" x="539" y="107" text-anchor="middle">Fit</text><text class="s" x="539" y="132" text-anchor="middle">least-squares</text><text class="s" x="539" y="150" text-anchor="middle">variants</text><rect class="b" x="682" y="70" width="150" height="104" rx="18" transform="translate(-28 0)"/><text class="t" x="729" y="107" text-anchor="middle">Interpret</text><text class="s" x="729" y="132" text-anchor="middle">substrate</text><text class="s" x="729" y="150" text-anchor="middle">dependence</text><path class="arr" d="M178 122 H243"/><path class="arr" d="M396 122 H461"/><path class="arr" d="M614 122 H651"/><g transform="translate(42,205)"><path class="line" d="M0 38 C35 8 65 26 98 2 C124 -18 151 -10 181 -34"/><circle class="pt" cx="0" cy="38" r="5"/><circle class="pt" cx="67" cy="24" r="5"/><circle class="pt" cx="127" cy="-12" r="5"/><circle class="pt" cx="181" cy="-34" r="5"/><text class="s" x="86" y="68" text-anchor="middle">data + model curves</text></g></svg>