name: Verify published FokoLab recovery
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-live-recovery.yml]
permissions:
  contents: read
  pages: read
jobs:
  deployed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Inspect live source, not search-engine cache
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import pathlib,json,hashlib,urllib.request,urllib.error,time,os,concurrent.futures
          base='https://chilperic.github.io/chilperic_ode_solver/'
          report={'release':'80.1.0','checked_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'expected_application_commit':'35c4eaea579f9b6d8ffb178c4cffea6d1f02d100','checks':[]}
          try:
            req=urllib.request.Request('https://api.github.com/repos/chilperic/chilperic_ode_solver/pages',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=20) as r: settings=json.load(r)
            report['pages_settings']={k:settings.get(k) for k in ('status','html_url','build_type','source')}
          except Exception as e:report['pages_settings_error']=str(e)
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'FokoLab-owner-release-verification/80.1','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=18) as r:return r.status,r.read(25000000),r.geturl()
          prefix=None;attempts=[]
          for n in range(14):
            for sub in ('','site/','docs/'):
              url=base+sub+'VERSION.json?recovery=80.1.0&check='+str(n)
              try:
                status,data,_=get(url);ver=json.loads(data)
                attempts.append({'url':url,'status':status,'version':ver.get('version')})
                if ver.get('version')=='80.1.0':prefix=base+sub;break
              except Exception as e:attempts.append({'url':url,'error':str(e)})
            if prefix:break
            time.sleep(12)
          report['version_attempts']=attempts;report['published_base']=prefix
          if prefix:
            paths=['index.html','experiments.html','saved-experiments.html','recovery.html','VERSION.json','plants/index.html','plants/worker.js','plants/plant-renderer.js','plants/circulation-ui.js','leaf/index.html','leaf/worker.js','tcells/index.html','tcells/worker.js','tcells/tcell-engine.js','tcells/age-engine.js','lipids/index.html','lipids/worker.js','lipids/lipid-engine.js','shared/model-motion.js','shared/bio-scenes.js','random.html','engine.js','app.js','continuum/advanced.html','continuum/advanced-worker.js','continuum/advanced-engine.js','continuum/journey.js','continuum/approaches.html','continuum/approaches-worker.js','continuum/index.html','src/integration/registry.js','src/integration/shell.js','src/upgrade/registry.js','src/recovery/catalog-bridge.js','src/core/ode.js','src/core/statistics.js','assets/brand/foko-lab-micro.svg','book.html','optimization.html','sensitivity.html','studio.html']
            def verify(p):
              expected=hashlib.sha256((pathlib.Path('site')/p).read_bytes()).hexdigest()
              try:
                code,data,url=get(prefix+p+'?recovery-check=80.1.0')
                found=hashlib.sha256(data).hexdigest()
                return {'path':p,'url':url,'http_status':code,'expected_sha256':expected,'published_sha256':found,'status':'passed' if found==expected else 'different'}
              except Exception as e:return {'path':p,'status':'failed','error':str(e)}
            with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:report['checks']=list(ex.map(verify,paths))
          report['summary']={s:sum(x['status']==s for x in report['checks']) for s in ('passed','different','failed')}
          report['verified_deployment']=bool(prefix) and all(x['status']=='passed' for x in report['checks'])
          pathlib.Path('live-recovery-verification.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k not in ('checks','version_attempts')},indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: live-recovery-verification
          path: live-recovery-verification.json
          retention-days: 14
