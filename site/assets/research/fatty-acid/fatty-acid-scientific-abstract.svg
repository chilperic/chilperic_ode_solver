<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Fatty-acid synthesis, from regulation to products</title><desc id="desc">Two modelling scales connect hepatic metabolism with enzyme kinetics.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#536B72" stroke-width="1.5"/></marker></defs><rect width="1600" height="900" fill="#FFF"/><rect x="56" y="50" width="8" height="88" fill="#087E8B"/><text x="88" y="83" fill="#193C45" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" text-anchor="start">Fatty-acid synthesis, from regulation to products</text><text x="88" y="125" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">Two modelling scales connect hepatic metabolism with enzyme kinetics.</text><text x="56" y="192" fill="#087E8B" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">01 / METABOLIC REGULATION</text><rect x="56" y="221" width="292" height="83" rx="10" fill="#F4FAFA" stroke="#087E8B" stroke-width="2"/><text x="202.0" y="271.5" fill="#087E8B" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" text-anchor="middle">Acetyl-CoA</text><rect x="416" y="221" width="292" height="83" rx="10" fill="#F4FAFA" stroke="#087E8B" stroke-width="2"/><text x="562.0" y="271.5" fill="#087E8B" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" text-anchor="middle">Malonyl-CoA</text><rect x="776" y="221" width="292" height="83" rx="10" fill="#F4FAFA" stroke="#087E8B" stroke-width="2"/><text x="922.0" y="271.5" fill="#087E8B" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" text-anchor="middle">Fatty acids</text><rect x="1136" y="221" width="292" height="83" rx="10" fill="#F4FAFA" stroke="#087E8