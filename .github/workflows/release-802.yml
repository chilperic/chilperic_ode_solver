name: Assemble and verify FokoLab 80.2
on:
  push:
    branches: [release/80.2.0-publish]
    paths:
      - deployment/802/**
      - .github/workflows/release-802.yml
      - README.md
permissions:
  contents: write
concurrency:
  group: fokolab-802-staging
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/80.2.0-publish
          fetch-depth: 0
      - name: Install pinned acceptance tools
        run: |
          python3 -m pip install numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8 playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Verify source hashes and assemble application without replacing CVs
        run: python3 deployment/802/assemble.py
      - name: Exercise all scientific methods and compatible figures
        run: node deployment/802/smoke.mjs
      - name: Independent Python and actual HTTP browser acceptance
        run: python3 deployment/802/verify.py
      - name: Commit only accepted application and publication mirror
        env:
          STAGING_BRANCH: release/80.2.0-publish
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$STAGING_BRANCH"
          git config user.name 'FokoLab verified publication'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site docs
          git commit -m 'Publish source-verified FokoLab 80.2 application with six preserved CV editions'
          git push origin "HEAD:$STAGING_BRANCH"
          echo "STAGED_COMMIT=$(git rev-parse HEAD)"
          echo "STAGED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fokolab-802-release-acceptance
          path: |
            evidence/deployment-80.2/*.json
            evidence/deployment-80.2/*.png
            evidence/deployment-80.2/*.svg
            evidence/deployment-80.2/browser-reproduce.py
            evidence/deployment-80.2/python/*/execution.log
          retention-days: 30
