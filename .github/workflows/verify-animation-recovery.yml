name: Verify recovered simulation animations
on:
  push:
    branches: [recovery/sites-animations-2026-10-02]
    paths:
      - tools/build_unified_recovery.py
      - tests/recovery_browser.py
      - tests/recovery_numerical.cjs
      - .github/workflows/verify-animation-recovery.yml
permissions:
  contents: read
concurrency:
  group: verify-animation-recovery
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install test tools
        run: |
          python3 -m pip install beautifulsoup4 playwright
          python3 -m playwright install --with-deps chromium
      - name: Build from original recovered source
        run: |
          mkdir -p evidence/recovery
          python3 tools/build_unified_recovery.py | tee evidence/recovery/build.log
      - name: Run retained numerical regression suite
        continue-on-error: true
        run: node tests/preservation-regression.mjs 2>&1 | tee evidence/recovery/preservation.log
      - name: Run source-specific numerical checks
        continue-on-error: true
        run: |
          if test -f tests/recovery_numerical.cjs; then node tests/recovery_numerical.cjs; fi
      - name: Test actual HTTP navigation, workers, animation and export controls
        continue-on-error: true
        run: python3 tests/recovery_browser.py 2>&1 | tee evidence/recovery/browser.log
      - name: Package public application and explicit evidence
        if: always()
        shell: python
        run: |
          import pathlib, json, zipfile, hashlib
          p=pathlib.Path('evidence/recovery');p.mkdir(parents=True,exist_ok=True)
          browser=p/'browser.json'
          summary={'release':'80.1.0','status':'verification artifact; not a deployed or fully validated release','browser':json.loads(browser.read_text()) if browser.exists() else {'status':'incomplete','details':'See browser.log for failure; no passing result inferred.'}}
          pathlib.Path('site/recovery-tests.json').write_text(json.dumps(summary,indent=2))
          out=pathlib.Path('artifacts');out.mkdir(exist_ok=True)
          with zipfile.ZipFile(out/'FokoLab-80.1.0-Recovery-Candidate.zip','w',zipfile.ZIP_DEFLATED) as z:
            for folder in ('site','evidence/recovery'):
              for f in pathlib.Path(folder).rglob('*'):
                if not f.is_file() or f.is_symlink() or 'http-root' in f.parts or f.suffix.lower() in ('.woff','.woff2','.ttf','.eot','.otf'):continue
                z.write(f,str(f))
            for f in ('tools/build_unified_recovery.py','tests/recovery_browser.py','tests/recovery_numerical.cjs'):
              if pathlib.Path(f).is_file():z.write(f,f)
          print('PUBLIC CANDIDATE',hashlib.sha256((out/'FokoLab-80.1.0-Recovery-Candidate.zip').read_bytes()).hexdigest())
      - name: Upload evidence separately for rapid inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-verification-evidence
          path: |
            evidence/recovery/*.json
            evidence/recovery/*.log
            evidence/recovery/*.png
            site/recovery-manifest.json
          retention-days: 14
      - name: Upload recoverable application candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-application-candidate
          path: artifacts/*.zip
          retention-days: 14
