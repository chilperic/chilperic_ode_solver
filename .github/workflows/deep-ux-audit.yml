name: Deep audit of approved FokoLab legacy
on:
  push:
    branches: [audit/80.1-ux-visualization]
    paths: [tests/deep_ux_audit.py, .github/workflows/deep-ux-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install pinned accessibility engine and browser tooling
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          npm install --prefix /tmp/foko-axe --no-audit --ignore-scripts axe-core@4.11.0
          mkdir -p node_modules
          ln -s /tmp/foko-axe/node_modules/axe-core node_modules/axe-core
      - name: Audit actual HTTP interface and native simulation state
        run: |
          mkdir -p evidence/deep-audit
          python3 tests/deep_ux_audit.py 2>&1 | tee evidence/deep-audit/audit.log
      - name: Upload audit evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fokolab-deep-ux-audit
          path: |
            evidence/deep-audit/*.json
            evidence/deep-audit/*.png
            evidence/deep-audit/*.log
          retention-days: 14
