<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Foko Lab State Observatory emblem</title>
  <desc id="desc">A multiscale scientific model space: a continuous response manifold, uncertainty contours, and a discrete population lattice are linked by one observable state axis and an evolutionary branch.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#243C86"/><stop offset=".52" stop-color="#654DA6"/><stop offset="1" stop-color="#009B89"/></linearGradient>
    <linearGradient id="surfaceGlow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6F61C8" stop-opacity=".22"/><stop offset="1" stop-color="#009B89" stop-opacity=".04"/></linearGradient>
    <linearGradient id="infer" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#654DA6"/><stop offset=".55" stop-color="#2B6FA8"/><stop offset="1" stop-color="#009B89"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111D27"/><stop offset=".62" stop-color="#20345E"/><stop offset="1" stop-color="#243C86"/></linearGradient>
    <linearGradient id="state" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4C05B"/><stop offset=".5" stop-color="#E89B35"/><stop offset="1" stop-color="#C9672A"/></linearGradient>
    <clipPath id="topPlane"><path d="M128 17 224 68 128 119 32 68Z"/></clipPath>
    <filter id="planeShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#17232D" flood-opacity=".16"/></filter>
  </defs>

  <!-- Discrete / agent / population layer -->
  <g filter="url(#planeShadow)">
    <path d="M128 151 221 201 128 251 35 201Z" fill="url(#base)" stroke="#14222D" stroke-width="4.6" stroke-linejoin="round"/>
    <g fill="none" stroke="#91A8C9" stroke-width="1.55" opacity=".9">
      <path d="M58 189 151 239M81 176 174 226M104 164 197 214"/>
      <path d="M58 214 151 164M81 226 174 176M104 239 197 189"/>
    </g>
    <g stroke="#14222D" stroke-width="1.2">
      <circle cx="82" cy="201" r="4.2" fill="#E9F0F7"/><circle cx="128" cy="225" r="4.2" fill="#5E9A68"/>
      <circle cx="174" cy="201" r="4.2" fill="#E9F0F7"/><circle cx="128" cy="177" r="4.2" fill="#2B6FA8"/>
      <circle cx="105" cy="189" r="3.1" fill="#654DA6"/><circle cx="151" cy="213" r="3.1" fill="#D17B2F"/>
    </g>
  </g>

  <!-- Inference / uncertainty layer -->
  <g filter="url(#planeShadow)">
    <path d="M128 100 212 145 128 190 44 145Z" fill="#FFFDF8" fill-opacity=".97" stroke="url(#infer)" stroke-width="4.8" stroke-linejoin="round"/>
    <path d="M66 145C86 125 108 124 128 134C148 124 170 125 190 145C170 165 148 166 128 156C108 166 86 165 66 145Z" fill="#654DA6" fill-opacity=".075" stroke="#654DA6" stroke-width="2.3"/>
    <path d="M84 145C100 132 115 132 128 138C141 132 156 132 172 145C156 158 141 158 128 152C115 158 100 158 84 145Z" fill="#2B6FA8" fill-opacity=".045" stroke="#2B6FA8" stroke-width="2"/>
    <path d="M101 145C111 139 120 139 128 142C136 139 145 139 155 145C145 151 136 151 128 148C120 151 111 151 101 145Z" fill="#009B89" fill-opacity=".08" stroke="#009B89" stroke-width="1.9"/>
    <circle cx="128" cy="145" r="2.7" fill="#17232D"/>
  </g>

  <!-- Continuous response / dynamical manifold -->
  <g filter="url(#planeShadow)">
    <path d="M128 17 224 68 128 119 32 68Z" fill="url(#surfaceGlow)" stroke="url(#surface)" stroke-width="5.8" stroke-linejoin="round"/>
    <g clip-path="url(#topPlane)">
      <path d="M33 76C55 60 73 67 92 53C111 39 124 55 143 42C161 30 178 47 195 57C207 64 216 67 226 68L226 83C213 82 205 78 193 72C175 63 161 50 144 60C127 70 116 58 99 69C82 80 65 74 45 87Z" fill="url(#surface)" fill-opacity=".12"/>
      <path d="M35 73C57 57 75 64 94 50C113 36 125 53 143 41C161 29 178 46 195 56C207 63 216 67 225 68" fill="none" stroke="#243C86" stroke-width="5" stroke-linecap="round"/>
      <path d="M39 83C60 68 78 74 96 62C114 50 126 65 144 54C161 44 177 58 193 66C205 72 213 75 221 77" fill="none" stroke="#654DA6" stroke-width="3.15" stroke-linecap="round"/>
      <path d="M44 93C64 80 82 85 99 75C116 65 128 78 145 68C162 59 178 71 193 78C204 83 211 85 218 87" fill="none" stroke="#009B89" stroke-width="3" stroke-linecap="round"/>
      <path d="M55 53 151 104M80 40 176 91M104 29 200 80" fill="none" stroke="#FFFFFF" stroke-opacity=".33" stroke-width="1"/>
    </g>
  </g>

  <!-- Shared observable state + evolutionary split. Together they hide a subtle F/K signature. -->
  <path d="M128 46V228" stroke="#17232D" stroke-opacity=".2" stroke-width="8" stroke-linecap="round"/>
  <path d="M128 46V228" stroke="#D17B2F" stroke-width="4.8" stroke-linecap="round"/>
  <path d="M128 59 137 68 128 77 119 68ZM128 136 137 145 128 154 119 145ZM128 192 137 201 128 210 119 201Z" fill="url(#state)" stroke="#FFF8ED" stroke-width="2.4"/>
  <circle cx="128" cy="45" r="3.4" fill="#F4C05B" stroke="#FFF8ED" stroke-width="1.5"/>
  <path d="M128 201C110 191 99 179 93 163M128 201C146 191 157 179 163 163" fill="none" stroke="#5E9A68" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="93" cy="163" r="4.3" fill="#5E9A68" stroke="#FFFDF8" stroke-width="1.2"/><circle cx="163" cy="163" r="4.3" fill="#5E9A68" stroke="#FFFDF8" stroke-width="1.2"/>
</svg>
