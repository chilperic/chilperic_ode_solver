anchor="middle">C6 chain</text><text x="814.0" y="566.5" fill="#087E8B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="middle">enzyme-bound</text><rect x="992" y="489" width="212" height="102" rx="10" fill="#F4FAFA" stroke="#087E8B" stroke-width="2"/><text x="1098.0" y="531.5" fill="#087E8B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="middle">C14 chain</text><text x="1098.0" y="566.5" fill="#087E8B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="middle">enzyme-bound</text><rect x="1276" y="489" width="212" height="102" rx="10" fill="#F4FAFA" stroke="#087E8B" stroke-width="2"/><text x="1382.0" y="531.5" fill="#087E8B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="middle">C16 chain</text><text x="1382.0" y="566.5" fill="#087E8B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="middle">enzyme-bound</text><path d="M302 540 L411 540" fill="none" stroke="#536B72" stroke-width="3" marker-end="url(#arrow)"/><path d="M644 540 L695 540" fill="none" stroke="#536B72" stroke-width="3" marker-end="url(#arrow)"/><text x="946" y="548" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">···</text><path d="M1212 540 L1263 540" fill="none" stroke="#536B72" stroke-width="3" marker-end="url(#arrow)"/><text x="910" y="478" fill="#193C45" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="middle">Repeated two-carbon additions: malonyl-CoA + NADPH</text><path d="M1098 601 L1098 648" fill="none" stroke="#536B72" stroke-width="3" marker-end="url(#arrow)"/><rect x="992" y="660" width="212" height="68" rx="10" fill="#F4F7FB" stroke="#426FA4" stroke-width="2"/><text x="1098.0" y="703.0" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" text-anchor="middle">C14:0</text><path d="M1382 601 L1382 648" fill="none" stroke="#536B72" stroke-width="3" marker-end="url(#arrow)"/><rect x="1276" y="660" width="212" height="68" rx="10" fill="#F4F7FB" stroke="#426FA4" stroke-width="2"/><text x="1382.0" y="703.0" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" text-anchor="middle">C16:0</text><text x="1488" y="768" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="end">Selected products shown; the model also includes C18:0.</text><rect x="56" y="651" width="756" height="95" rx="10" fill="#FEF9F0" stroke="#C68125" stroke-width="2"/><text x="434.0" y="707.5" fill="#C68125" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="middle">CoA inhibition + product time-course fitting</text><path d="M56 823 L1544 823" fill="none" stroke="#DAE3E4" stroke-width="3"/><text x="56" y="861" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Research scheme • simplified from the PhD model and kinetic-data study (2023)</text><text x="1544" y="861" fill="#193C45" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end">FOKOLAB / RESEARCH</text></svg>