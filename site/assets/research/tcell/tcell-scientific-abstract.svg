rial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">After 2 divisions</text><rect x="668" y="572" width="72.5" height="31" rx="2" fill="#426FA4" stroke="#426FA4" stroke-width="2"/><text x="850" y="663" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">Dye signal ≈ halves</text><text x="850" y="702" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">at each division</text><text x="850" y="749" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Schematic signal, not measured data</text><path d="M1082 434 L1121 434" fill="none" stroke="#536B72" stroke-width="3" marker-end="url(#arrow)"/><rect x="1140" y="237" width="404" height="104" rx="10" fill="#F4F7FB" stroke="#426FA4" stroke-width="2"/><text x="1342.0" y="280.5" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="middle">Smith–Martin</text><text x="1342.0" y="315.5" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="middle">Cell-cycle timing</text><rect x="1140" y="382" width="404" height="104" rx="10" fill="#F4F7FB" stroke="#426FA4" stroke-width="2"/><text x="1342.0" y="425.5" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="middle">Cyton</text><text x="1342.0" y="460.5" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="middle">Division / death clocks</text><rect x="1140" y="527" width="404" height="104" rx="10" fill="#F4F7FB" stroke="#426FA4" stroke-width="2"/><text x="1342.0" y="570.5" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="middle">Branching models</text><text x="1342.0" y="605.5" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="middle">Lineage variability</text><text x="1342" y="706" fill="#193C45" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle">Fit Smith–Martin / Cyton</text><text x="1342" y="746" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle">to simulated CFSE observations</text><path d="M56 823 L1544 823" fill="none" stroke="#DAE3E4" stroke-width="3"/><text x="56" y="861" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Research scheme • lineage illustrates division only; candidate models also account for death</text><text x="1544" y="861" fill="#193C45" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end">FOKOLAB / RESEARCH</text></svg>