name: Stage verified FokoLab 80.1 recovery
on:
  push:
    branches: [recovery/sites-animations-2026-10-02]
    paths: [.github/workflows/promote-verified-recovery.yml]
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Download the exact inspected artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' 'https://api.github.com/repos/chilperic/chilperic_ode_solver/actions/artifacts/11224764673/zip' --output /tmp/recovery-artifact.zip
          echo 'a13cfcc81352c18790d33a6c4a58183eb798661767a3c0c7a6cb0d4ae38efd74  /tmp/recovery-artifact.zip' | sha256sum --check
      - name: Verify tests and source hashes before staging any application file
        shell: python
        run: |
          import pathlib,zipfile,json,hashlib,shutil,datetime
          root=pathlib.Path('/tmp/foko-promotion');root.mkdir()
          def extract(z,base):
            for i in z.infolist():
              target=(base/i.filename).resolve()
              if not target.is_relative_to(base.resolve()):raise ValueError('Unsafe ZIP path')
              if (i.external_attr>>16)&0o170000==0o120000:raise ValueError('Symlink rejected')
            z.extractall(base)
          with zipfile.ZipFile('/tmp/recovery-artifact.zip') as z:extract(z,root)
          inner=root/'FokoLab-80.1.0-Recovery-Candidate.zip'
          assert hashlib.sha256(inner.read_bytes()).hexdigest()=='e967371be063f7871881568e80059b39b72ee844090bd7bd9d38a9d269905a5e'
          app=root/'application';app.mkdir()
          with zipfile.ZipFile(inner) as z:extract(z,app)
          ev=app/'evidence/recovery';browser=json.loads((ev/'browser.json').read_text());num=json.loads((ev/'source-numerical.json').read_text())
          assert browser['summary']=={'passed':56,'failed':0}
          assert num['summary']=={'passed':23,'failed':0}
          assert browser['browser_errors']==[] and browser['network_errors']==[]
          preserved=(ev/'preservation.log').read_text().splitlines()
          assert sum(x.startswith('PASS ') for x in preserved)==36 and not any(x.startswith('FAIL ') for x in preserved)
          site=app/'site';manifest=json.loads((site/'recovery-manifest.json').read_text())
          assert len(manifest['scientific_source_checks'])==62
          for x in manifest['scientific_source_checks']:
            assert hashlib.sha256((site/x['path']).read_bytes()).hexdigest()==x['source_sha256'],x['path']
          for p in site.rglob('*'):
            assert p.suffix.lower() not in ('.woff','.woff2','.ttf','.otf','.eot'),str(p)
            assert 'private-reference' not in p.parts,str(p)
          assert json.loads((site/'VERSION.json').read_text())['version']=='80.1.0'
          shutil.copytree(site,'site',dirs_exist_ok=True)
          shutil.copytree(site,'docs',dirs_exist_ok=True)
          dest=pathlib.Path('evidence/recovery');dest.mkdir(parents=True,exist_ok=True)
          for f in ev.iterdir():
            if f.is_file() and (f.name in ('browser.json','source-numerical.json','browser.log','preservation.log','build.log','integration-fixes.log','source-numerical.log') or f.suffix=='.png'):shutil.copy2(f,dest/f.name)
          record={'release':'80.1.0','candidate_sha256':hashlib.sha256(inner.read_bytes()).hexdigest(),'verified_source_commit':'4a0fa8e1a6496a47dc7160145b6d8c7850429229','verification_run':37006084270,'artifact_id':11224764673,'browser':browser['summary'],'source_numerical':num['summary'],'retained_numerical':{'passed':36,'failed':0},'exact_scientific_assets':62,'staged_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'publication_scope':'Only tested public site copied. Existing author/private root material is neither included in the public artifact nor newly published by this process.'}
          (dest/'promotion.json').write_text(json.dumps(record,indent=2))
          pathlib.Path('README_RECOVERED_ANIMATIONS.md').write_text('# FokoLab 80.1.0 — original simulation recovery\n\nRun `python3 serve.py` locally. The complete public website is in `site/`; `docs/` mirrors it for GitHub Pages.\n\nRecovered native applications: plants/, leaf/, tcells/, lipids/, random.html, continuum/advanced.html, continuum/approaches.html and continuum/index.html.\n\nThe original 259 analytical catalogue records, 115 recovered source scenarios and 180 retained teaching configurations are searchable together. Configurations are not distinct-model counts.\n\nSee site/recovery.html, site/recovery-manifest.json and site/recovery-tests.json for scientific-source preservation, test scope and unavailable source archives.\n\nVerification: 56 real Chromium checks, 23 source-specific numerical checks, 36 retained numerical checks; no browser exceptions or failed local HTTP responses in the exercised workflows. This is not empirical or real-device certification.\n\nThree originally advertised ZIP exports returned HTTP 403 and are explicitly marked unavailable. Browser source and native data/image exports were recovered separately.\n')
          print(json.dumps(record,indent=2))
      - name: Commit tested files only to the recovery branch
        env:
          RECOVERY_BRANCH: recovery/sites-animations-2026-10-02
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$RECOVERY_BRANCH"
          git config user.name 'FokoLab verified recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site docs evidence/recovery README_RECOVERED_ANIMATIONS.md
          git commit -m 'FokoLab 80.1.0: restore original animation engines and verified unified workspaces'
          git push origin "HEAD:$RECOVERY_BRANCH"
          echo "STAGED_COMMIT=$(git rev-parse HEAD)"
