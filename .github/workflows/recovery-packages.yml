name: Retrieve original published packages
on:
  push:
    branches: [recovery/sites-animations-2026-10-02]
    paths: [.github/workflows/recovery-packages.yml]
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Download only the three source-advertised archives
        shell: python
        run: |
          import pathlib, urllib.request, hashlib, json, zipfile, shutil
          p=pathlib.Path('retrieved-packages');p.mkdir()
          origin='https://dice-branch-fractal.chilpericarmel.chatgpt.site/'
          records=[]
          for rel in ('downloads/FokoLab-public-site.zip','plants/python/plant_lab_python.zip','leaf/python/research_leaf_python.zip'):
            rec={'url':origin+rel}
            try:
              with urllib.request.urlopen(origin+rel,timeout=90) as r:
                data=r.read(150_000_001)
                if len(data)>150_000_000: raise ValueError('Archive budget exceeded')
              dest=p/pathlib.PurePosixPath(rel).name;dest.write_bytes(data)
              with zipfile.ZipFile(dest) as z:
                entries=[{'path':i.filename,'bytes':i.file_size} for i in z.infolist()]
              rec.update(status='downloaded',file=dest.name,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),entries=entries)
            except Exception as e: rec.update(status='failed',error=str(e))
            records.append(rec)
          (p/'retrieval.json').write_text(json.dumps(records,indent=2))
          # Baseline is exactly the public application subtree. Never include author/private files.
          with zipfile.ZipFile(p/'FokoLab-80.0.0-Public-Baseline.zip','w',zipfile.ZIP_DEFLATED) as z:
            for f in pathlib.Path('site').rglob('*'):
              if f.is_file() and f.suffix.lower() not in ('.ttf','.otf','.woff','.woff2','.eot'):
                z.write(f,str(f))
          print(json.dumps([{k:v for k,v in r.items() if k!='entries'} for r in records],indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fokolab-recovered-distributions
          path: retrieved-packages/
          retention-days: 7
