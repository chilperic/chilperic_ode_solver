<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker><style>.phase{fill:#eff6ff;stroke:#1e3a8a;stroke-width:2.5}.bphase{fill:#ecfdf5;stroke:#047857;stroke-width:2.5}.t{font:700 21px Inter,Arial}.s{font:500 14px Inter,Arial;fill:#475569}.arr{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#b91c1c;stroke-width:4}</style></defs><text class="t" x="380" y="34" text-anchor="middle">Smith–Martin: A/B phase with generation structure</text><g transform="translate(50,75)"><rect class="phase" x="0" y="0" width="115" height="70" rx="18"/><text class="t" x="57" y="43" text-anchor="middle">Aₙ</text><text class="s" x="57" y="90" text-anchor="middle">random exit λ</text><rect class="bphase" x="215" y="0" width="115" height="70" rx="18"/><text class="t" x="272" y="43" text-anchor="middle">Bₙ</text><text class="s" x="272" y="90" text-anchor="middle">delay Δ</text><rect class="phase" x="450" y="0" width="150" height="70" rx="18"/><text class="t" x="525" y="43" text-anchor="middle">2Aₙ₊₁</text><text class="s" x="525" y="90" text-anchor="middle">post-division generation</text><path class="arr" d="M115 35 H212"/><path class="arr" d="M330 35 H447"/><path class="d" d="M70 118 l30 30 m0 -30 l-30 30"/><path class="d" d="M285 118 l30 30 m0 -30 l-30 30"/><text class="s" x="85" y="178" text-anchor="middle">death dₙ</text><text class="s" x="300" y="178" text-anchor="middle">survival through B phase</text></g></svg>