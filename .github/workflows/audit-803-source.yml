name: Capture 80.3 audit baseline
on:
  push:
    branches: [audit/80.3-unified-science-2026-10-05]
    paths: [.github/workflows/audit-803-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Archive public application and verification sources
        shell: python
        run: |
          import pathlib,zipfile,subprocess,json,hashlib
          roots=['site','tests','deployment','README.md','serve.py']
          with zipfile.ZipFile('FokoLab-803-Audit-Baseline.zip','w',zipfile.ZIP_DEFLATED) as z:
            for r in roots:
              p=pathlib.Path(r)
              for f in ([p] if p.is_file() else p.rglob('*')):
                if f.is_file() and not f.is_symlink() and f.suffix.lower() not in ('.woff','.woff2','.ttf','.otf','.eot') and 'private-reference' not in f.parts:
                  z.write(f,str(f))
            z.writestr('AUDIT_BASELINE.json',json.dumps({'application_commit':'559cd84a859368081446270efac137decdb5852b','snapshot_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}))
          print(hashlib.sha256(pathlib.Path('FokoLab-803-Audit-Baseline.zip').read_bytes()).hexdigest())
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fokolab-803-audit-baseline
          path: FokoLab-803-Audit-Baseline.zip
          retention-days: 14
