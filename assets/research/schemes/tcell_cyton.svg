<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker><style>.cell{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3}.dest{fill:#fff7ed;stroke:#c2410c;stroke-width:2.5}.t{font:700 21px Inter,Arial}.s{font:500 14px Inter,Arial;fill:#475569}.arr{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.curve{stroke:#0f766e;stroke-width:3;fill:none}</style></defs><text class="t" x="380" y="34" text-anchor="middle">Cyton: division and death as competing random events</text><circle class="cell" cx="150" cy="132" r="38"/><text class="t" x="150" y="138" text-anchor="middle">cell</text><path class="arr" d="M188 120 C250 70 320 70 390 95"/><path class="arr" d="M188 145 C250 195 320 195 390 170"/><rect class="dest" x="410" y="56" width="190" height="72" rx="18"/><text class="t" x="505" y="90" text-anchor="middle">division</text><text class="s" x="505" y="113" text-anchor="middle">two daughters</text><rect class="dest" x="410" y="152" width="190" height="72" rx="18"/><text class="t" x="505" y="187" text-anchor="middle">death</text><text class="s" x="505" y="210" text-anchor="middle">removed from lineage</text><path class="curve" d="M90 220 C125 175 175 175 212 220"/><text class="s" x="151" y="241" text-anchor="middle">fate = first event time</text></svg>