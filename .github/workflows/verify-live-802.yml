name: Verify published FokoLab release
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - README.md
      - .github/workflows/verify-live-802.yml
permissions:
  contents: read
concurrency:
  group: fokolab-802-live
  cancel-in-progress: true
jobs:
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify the actual published bytes against this commit
        shell: python
        run: |
          from pathlib import Path
          import concurrent.futures,hashlib,json,os,time,urllib.request
          out=Path('evidence/live-current');out.mkdir(parents=True,exist_ok=True)
          base='https://chilperic.github.io/chilperic_ode_solver/'
          version=json.loads(Path('site/VERSION.json').read_text())['version']
          report={'release':version,'commit':os.environ['GITHUB_SHA'],'checkedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'attempts':[]}
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'FokoLab-release-verification/'+version,'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:return r.status,r.read(25000000),r.headers.get('Content-Type','')
          expected=hashlib.sha256(Path('site/VERSION.json').read_bytes()).hexdigest();prefix=None
          for attempt in range(18):
              for sub in ('site/','','docs/'):
                  url=base+sub+'VERSION.json?release-check='+os.environ['GITHUB_SHA']+'&attempt='+str(attempt)
                  try:
                      status,data,mime=get(url);v=json.loads(data);h=hashlib.sha256(data).hexdigest()
                      report['attempts'].append({'url':url,'version':v.get('version'),'exact':h==expected})
                      if v.get('version')==version and h==expected:prefix=base+sub;break
                  except Exception as e:report['attempts'].append({'url':url,'error':str(e)})
              if prefix:break
              time.sleep(10)
          report['publishedBase']=prefix
          paths=['index.html','analysis.html','analysis-studio.html','decision-studio.html','VERSION.json','contact.html','contributors.html','contributors.json','cv.html','cv/downloads.json','styles/revision83.css','styles/analysis-studio.css','src/integration/shell.js','src/integration/registry.js','src/revision82/run-integrity.js','plants/index.html','plants/plant-renderer.js','plants/water-circuit.js','plants/plant-ui.js','plants/plant.css','leaf/index.html','shared/leaf-diagnostics.js','design/workspace.js','design/leaf-diagnostic-ui.js','tcells/index.html','tcells/worker.js','tcells/tcell-engine.js','lipids/index.html','lipids/worker.js','lipids/lipid-engine.js','continuum/advanced.html','continuum/advanced-ui.js','continuum/advanced-worker.js','research/remote-client.js','research/remote-worker.js','continuum/approaches.html','random.html','engine.js','ode.html','statistics.html','optimization.html','src/v72/optimization-workspace.js','book.html','assets/profile-chilperic.webp','audit-80.3.json','AUDIT-80.3.md']
          paths += ['src/analysis-studio/'+p for p in ('statistics.mjs','compute.mjs','methods.mjs','demos.mjs','plots.mjs','explain.mjs','ui.mjs','worker.mjs','reproduce.py')]
          paths += ['src/revision83/'+p for p in ('workflow.js','presentation.js','decision-core.mjs','decision-ui.mjs','decision-worker.mjs','decision-bridge.js')]
          paths += ['cv/'+e['id']+'.pdf' for e in json.loads(Path('site/cv/downloads.json').read_text())['editions']]
          if prefix:
              def check(path):
                  try:
                      status,data,mime=get(prefix+path+'?release-check='+os.environ['GITHUB_SHA'])
                      expected=hashlib.sha256((Path('site')/path).read_bytes()).hexdigest();actual=hashlib.sha256(data).hexdigest()
                      scriptOK=not path.endswith('.mjs') or any(x in mime for x in ('javascript','ecmascript'))
                      return {'path':path,'http':status,'mime':mime,'expectedSHA256':expected,'publishedSHA256':actual,'passed':actual==expected and scriptOK}
                  except Exception as e:return {'path':path,'passed':False,'error':str(e)}
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:report['checks']=list(ex.map(check,paths))
              try:report['rootHTTP']=get(base)[0]
              except Exception as e:report['rootError']=str(e)
          removed=['plants/plant-engine.js','plants/c4-engine.js','plants/scenario-engine.js','leaf/leaf-engine.js','leaf/leaf-updated.js','leaf/presets.json','continuum/advanced-engine.js','continuum/approaches.js','continuum/engine.js','shared/soil-thermal.js']
          report['removedChecks']=[]
          if prefix:
              for path in removed:
                  try:
                      get(prefix+path+'?release-check='+os.environ['GITHUB_SHA']);report['removedChecks'].append({'path':path,'passed':False,'detail':'unexpectedly served'})
                  except Exception as e:
                      report['removedChecks'].append({'path':path,'passed':'404' in str(e),'detail':str(e)})
          report['passed']=bool(prefix) and report.get('rootHTTP')==200 and len(report.get('checks',[]))==len(paths) and all(c['passed'] for c in report.get('checks',[])) and all(c['passed'] for c in report.get('removedChecks',[]))
          (out/'published-hashes.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k not in ('checks','attempts')},indent=2))
          print('FILE_CHECKS',len(report.get('checks',[])))
          assert report['passed'],'Published files did not match this commit; see evidence.'
      - name: Install browser for live smoke tests
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Exercise live statistics, Pareto views, primary actions and attribution
        shell: python
        run: |
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          out=Path('evidence/live-current');hashes=json.loads((out/'published-hashes.json').read_text());base=hashes['publishedBase'];checks=[];errors=[]
          def verify(name,condition,detail=None):
              checks.append({'name':name,'passed':bool(condition),'detail':detail})
              assert condition,name
          try:
              with sync_playwright() as pw:
                  browser=pw.chromium.launch(headless=True,args=['--no-sandbox'])
                  page=browser.new_page(viewport={'width':1440,'height':1000},reduced_motion='reduce');page.on('pageerror',lambda e:errors.append(str(e)))
                  r=page.goto(base+'analysis-studio.html',wait_until='domcontentloaded',timeout=45000);verify('Statistics route',r.status==200)
                  page.wait_for_function('!!window.FokoAnalysisStudio',timeout=45000);page.locator('#as-run').click()
                  page.wait_for_function("window.FokoAnalysisResult?.method==='welch-anova'",timeout=45000)
                  page.wait_for_function("!!document.getElementById('as-plot-left')._fullLayout",timeout=30000)
                  verify('Live statistics worker and plot',not page.locator('#as-error').is_visible(),page.evaluate('({method:FokoAnalysisResult.method,units:FokoAnalysisResult.audit.analyzedUnits})'))
                  page.evaluate('window.scrollTo(0,document.documentElement.scrollHeight)');page.wait_for_timeout(100)
                  verify('Run remains visible after scrolling',page.locator('.fl-primary-run').evaluate('e=>{const r=e.getBoundingClientRect();return r.top>=0&&r.bottom<=innerHeight}'))
                  page.goto(base+'decision-studio.html',wait_until='domcontentloaded');page.wait_for_function('!!window.FokoDecisionStudio',timeout=30000)
                  page.locator('#ds-ref').fill('2,2');page.locator('#ds-run').click();page.wait_for_function('FokoDecisionStudio.getResult()?.hypervolume>0',timeout=30000)
                  data=page.evaluate('({front:FokoDecisionStudio.getResult().front.length,excluded:FokoDecisionStudio.getResult().excluded.length,hypervolume:FokoDecisionStudio.getResult().hypervolume})')
                  verify('Live Pareto module worker',data['front']==41 and data['excluded']==1,data)
                  page.wait_for_function("!!document.getElementById('ds-left')._fullLayout",timeout=20000);verify('Live trade-off rendering',not page.locator('#ds-error').is_visible())
                  page.screenshot(path=str(out/'live-decision-desktop.png'))
                  page.goto(base+'contact.html',wait_until='domcontentloaded');page.wait_for_selector('.fl-contact-photo');page.wait_for_function('document.querySelector(".fl-contact-photo").complete')
                  verify('Contact portrait',page.locator('.fl-contact-photo').evaluate('e=>e.naturalWidth>100'))
                  page.screenshot(path=str(out/'live-contact-desktop.png'))
                  page.goto(base+'plants/index.html',wait_until='domcontentloaded')
                  page.wait_for_function('document.getElementById("timeline").max>0 && document.getElementById("work").textContent.includes("Ready")',timeout=120000)
                  verify('Original plant controls and three growth canvases',page.locator('#growthCanvasC3').count()==1 and page.locator('#growthCanvasC4').count()==1 and page.locator('#growthCanvasCAM').count()==1 and page.locator('math').count()==0)
                  page.get_by_role('button',name='Show final state',exact=True).click()
                  page.wait_for_function('Number(document.getElementById("timeline").value)>0',timeout=10000)
                  verify('Original time scrubber',float(page.locator('#timeline').input_value())>0)
                  verify('No model-equation navigation',page.locator('a[href="#equations"]').count()==0)
                  page.goto(base+'continuum/advanced.html',wait_until='domcontentloaded')
                  page.locator('#advLive').select_option('fast')
                  page.locator('#advReps').fill('1');page.locator('#advCap').fill('12');page.locator('#advRun').click()
                  page.wait_for_function('document.getElementById("advStatus").textContent.includes("Completed")',timeout=120000)
                  page.locator('#advNext').click()
                  page.wait_for_function('document.getElementById("advEventLabel").textContent.startsWith("1 /")',timeout=10000)
                  verify('Native evolutionary journey',page.locator('#advEventLabel').inner_text().startswith('1 /') and page.locator('math').count()==0)
                  page.goto(base+'leaf/index.html',wait_until='domcontentloaded')
                  page.wait_for_function('document.getElementById("status").textContent==="Calculation complete."',timeout=60000)
                  verify('Interactive leaf result',page.locator('#metrics strong').count()==4 and page.locator('math').count()==0)
                  page.goto(base+'contributors.html',wait_until='domcontentloaded');text=page.locator('main').inner_text()
                  verify('Curated collaborator acknowledgements',all(x in text for x in ('Jérémie','Yvonne','Adélaïde','Barbara','Wilfred','AIMS','CEPLAS')))
                  verify('Visible acknowledgements navigation',page.locator('.fl-site-footer a[href$="contributors.html"]').count()==1)
                  page.goto(base+'cv.html',wait_until='domcontentloaded');verify('Six CV editions accessible',page.locator('.cv-downloads a[href$=".pdf"]').count()==6)
                  page.set_viewport_size({'width':390,'height':844});page.goto(base+'decision-studio.html',wait_until='domcontentloaded');page.wait_for_selector('.fl-primary-run');page.evaluate('window.scrollTo(0,document.documentElement.scrollHeight)')
                  verify('Mobile page reflow',page.evaluate('document.documentElement.scrollWidth<=innerWidth+2'))
                  verify('Mobile primary action visible',page.locator('.fl-primary-run').evaluate('e=>{const r=e.getBoundingClientRect();return r.top>=0&&r.bottom<=innerHeight&&r.right<=innerWidth}'))
                  page.screenshot(path=str(out/'live-decision-mobile.png'));verify('No browser exceptions',not errors,errors);browser.close()
          finally:
              (out/'live-browser.json').write_text(json.dumps({'release':hashes['release'],'commit':hashes['commit'],'passed':bool(checks) and all(c['passed'] for c in checks) and not errors,'checks':checks,'pageErrors':errors,'scope':'Live Chromium smoke tests; complete local acceptance and remaining accessibility findings are in audit-80.3.json.'},indent=2))
          print('LIVE_BROWSER_CHECKS',len(checks))
      - name: Retain served-byte and live-browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fokolab-live-release-verification
          path: evidence/live-current/
          retention-days: 30
