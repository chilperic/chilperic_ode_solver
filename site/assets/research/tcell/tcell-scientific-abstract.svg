<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Reverse-engineering T-cell proliferation</title><desc id="desc">Infer hidden division and death processes from generation-resolved observations.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#536B72" stroke-width="1.5"/></marker></defs><rect width="1600" height="900" fill="#FFF"/><rect x="56" y="50" width="8" height="88" fill="#426FA4"/><text x="88" y="83" fill="#193C45" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" text-anchor="start">Reverse-engineering T-cell proliferation</text><text x="88" y="125" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">Infer hidden division and death processes from generation-resolved observations.</text><text x="56" y="195" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">01 / CELL HISTORIES</text><text x="635" y="195" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">02 / OBSERVATION</text><text x="1140" y="195" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">03 / MODEL FAMILIES</text><path d="M118 434 L275 322" fill="none" stroke="#426FA4" stroke-width="3"/><path d="M118 434 L275 546" fill="none" stroke="#426FA4" stroke-width="3"/><path d="M307 322 L470 262" fill="none" stroke="#426FA4" stroke-width="3"/><path d="M307 322 L470 382" fill="none" stroke="#426FA4" stroke-width="3"/><path d="M307 546 L470 486" fill="none" stroke="#426FA4" stroke-width="3"/><path d="M307 546 L470 606" fill="none" stroke="#426FA4" stroke-width="3"/><circle cx="100" cy="434" r="34" fill="#426FA4" stroke="#426FA4" stroke-width="3"/><circle cx="292