<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-labelledby="title desc">
  <title id="title">Chilperic ODE logo</title>
  <desc id="desc">A scientific identity mark combining dynamical-system orbits, molecular nodes, and a rising phase trajectory.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.48" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2563eb" flood-opacity=".20"/>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <rect x="8" y="18" width="124" height="112" rx="32" fill="#ffffff" fill-opacity=".86"/>
    <path d="M26 87 C36 36, 108 22, 118 69 C128 115, 55 130, 34 94 C14 61, 82 28, 118 44" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <path d="M22 68 C51 92, 82 103, 123 82" fill="none" stroke="url(#g2)" stroke-width="5" stroke-linecap="round" opacity=".92"/>
    <path d="M62 124 C64 89, 72 55, 105 23" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" opacity=".72"/>
    <circle cx="34" cy="91" r="7" fill="#14b8a6"/>
    <circle cx="70" cy="64" r="8" fill="#2563eb"/>
    <circle cx="111" cy="43" r="7" fill="#7c3aed"/>
    <circle cx="117" cy="83" r="6" fill="#0ea5a3"/>
    <path d="M42 112 L53 102 L65 110 L77 97 L91 103 L105 88" fill="none" stroke="#102033" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>
  </g>

  <g transform="translate(154 34)">
    <text x="0" y="38" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="760" fill="#102033" letter-spacing="-.035em">Chilperic</text>
    <text x="236" y="38" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="39" font-weight="900" fill="url(#g1)" letter-spacing="-.02em">ODE</text>
    <path d="M3 55 H325" stroke="url(#g1)" stroke-width="4" stroke-linecap="round" opacity=".82"/>
    <text x="2" y="80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#647084" letter-spacing=".06em">DYNAMICAL SYSTEMS · METABOLISM · OPTIMIZATION</text>
  </g>
</svg>
