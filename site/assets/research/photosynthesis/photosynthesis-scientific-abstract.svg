<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Mechanistic evolution of photosynthesis</title><desc id="desc">Link environmental constraints, leaf physiology and alternative evolutionary outcomes.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#536B72" stroke-width="1.5"/></marker></defs><rect width="1600" height="900" fill="#FFF"/><rect x="56" y="50" width="8" height="88" fill="#3C8062"/><text x="88" y="83" fill="#193C45" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" text-anchor="start">Mechanistic evolution of photosynthesis</text><text x="88" y="125" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">Link environmental constraints, leaf physiology and alternative evolutionary outcomes.</text><rect x="56" y="169" width="1488" height="69" rx="10" fill="#F2F8F4" stroke="#3C8062" stroke-width="2"/><text x="800.0" y="212.5" fill="#3C8062" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" text-anchor="middle">Temperature   •   Water   •   Nitrogen   •   Light   •   CO₂</text><rect x="56" y="285" width="472" height="355" rx="10" fill="#FFF" stroke="#D8E1E1" stroke-width="2"/><rect x="56" y="285" width="472" height="8" rx="0" fill="#426FA4" stroke="#426FA4" stroke-width="2"/><text x="292" y="338" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle">C3</text><path d="M292 246 L292 276" fill="none" stroke="#536B72" stroke-width="3" marker-end="url(#arrow)"/><rect x="564" y="285" width="472" height="355" rx="10" fill="#FFF" stroke="#D8E1E1" stroke-width="2"/><rect x="564" y="285" width="472" height="8" rx="0" fill="#C68125" stroke="#C68125" stroke-width="2"/><text x="800" y="338" fill="#C68125" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle">C3–C4 intermediate</text><path d="M800 246 L800 276" fill="none" stroke="#536B72" stroke-width="3" marker-end="url(#arrow)"/><rect x="1072" y="285" width="472" height="355" rx="10" fill="#FFF" stroke="#D8E1E1" stroke-width="2"/><rect x="1072" y="285" width="472" height="8" rx="0" fill="#3C8062" stroke="#3C8062" stroke-width="2"/><text x="1308" y="338" fill="#3C8062" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle">C4</text><path d="M1308 246 L1308 276" fill="none" stroke="#536B72" stroke-width="3" marker-end="url(#arrow)"/><rect x="87" y="380" width="410" height="88" rx="10" fill="#F4F7FB" stroke="#426FA4" stroke-width="2"/><text x="292.0" y="433.0" fill="#426FA4" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" text-anchor="middle">Rubisco fixes CO₂</text><path d="M292 476 L292 504" fill="none" stroke="#536B72" stroke-width="3" marker-end="url(#arrow)"/><text x="292" y="546" fill="#193C45" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle">Photorespiration competes</text><text x="292" y="581" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle">with carbon assimilation</text><rect x="595" y="380" width="410" height="88" rx="10" fill="#FEF9F0" stroke="#C68125" stroke-width="2"/><text x="800.0" y="415.5" fill="#C68125" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">Photorespired CO₂</text><text x="800.0" y="450.5" fill="#C68125" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">is recaptured</text><text x="800" y="534" fill="#193C45" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">C2 is one intermediate strategy:</text><text x="800" y="572" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">glycine decarboxylation moves</text><text x="800" y="603" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">toward the bundle sheath</text><rect x="1103" y="380" width="410" height="70" rx="10" fill="#F2F8F4" stroke="#3C8062" stroke-width="2"/><text x="1308.0" y="424.0" fill="#3C8062" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">PEPC fixes carbon</text><path d="M1308 458 L1308 501" fill="none" stroke="#536B72" stroke-width="3" marker-end="url(#arrow)"/><text x="1517" y="486" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="end">C4 acids</text><rect x="1103" y="513" width="410" height="86" rx="10" fill="#F2F8F4" stroke="#3C8062" stroke-width="2"/><text x="1308.0" y="547.5" fill="#3C8062" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="middle">CO₂ released near Rubisco</text><text x="1308.0" y="582.5" fill="#3C8062" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="middle">in the bundle sheath</text><text x="800" y="686" fill="#193C45" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" text-anchor="middle">Different mechanisms carry different resource and energy costs</text><rect x="56" y="716" width="1488" height="80" rx="10" fill="#F5F8F8" stroke="#DAE3E4" stroke-width="2"/><text x="800" y="750" fill="#193C45" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">Research objective: compare assimilation under feasible physiological constraints</text><text x="800" y="782" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Replicate evolutionary histories test alternative routes and persistence of intermediates</text><path d="M56 823 L1544 823" fill="none" stroke="#DAE3E4" stroke-width="3"/><text x="56" y="861" fill="#536B72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Research framework • pathways are alternatives, not an inevitable progression to C4</text><text x="1544" y="861" fill="#193C45" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end">FOKOLAB / RESEARCH</text></svg>