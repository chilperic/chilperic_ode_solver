<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-labelledby="title desc"><title id="title">T-cell proliferation modeling pipeline</title><desc id="desc">CFSE generation data are analyzed through Smith-Martin, Cyton, simulation, inference and stochastic extensions.</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#25344d"/></marker><style>.b{fill:#f8fbff;stroke:#25344d;stroke-width:2.2;rx:18}.c{fill:#eef7ff}.g{fill:#f0fdf4}.p{fill:#fff7ed}.t{font:700 17px Inter,Arial,sans-serif;fill:#111827}.s{font:500 11.5px Inter,Arial,sans-serif;fill:#43566a}.arr{stroke:#25344d;stroke-width:2.8;fill:none;marker-end:url(#a)}.cell{fill:#7dd3fc;stroke:#1d4ed8;stroke-width:1.7}.fade{fill:#bfdbfe;opacity:.58}</style></defs><rect class="b c" x="22" y="82" width="130" height="92" rx="17"/><text class="t" x="87" y="116" text-anchor="middle">CFSE data</text><text class="s" x="87" y="140" text-anchor="middle">fluorescence halves</text><text class="s" x="87" y="157" text-anchor="middle">after division</text><g transform="translate(45,218)"><circle class="cell" cx="0" cy="0" r="14"/><circle class="cell fade" cx="48" cy="0" r="12"/><circle class="cell fade" cx="90" cy="0" r="10"/><circle class="cell fade" cx="127" cy="0" r="9"/><text class="s" x="64" y="34" text-anchor="middle">generation peaks</text></g><rect class="b g" x="205" y="42" width="145" height="96" rx="17"/><text class="t" x="277" y="77" text-anchor="middle">Smith–Martin</text><text class="s" x="277" y="101" text-anchor="middle">A phase → B phase</text><text class="s" x="277" y="118" text-anchor="middle">DDE / ODE model</text><rect class="b p" x="205" y="218" width="145" height="96" rx="17"/><text class="t" x="277" y="252" text-anchor="middle">Cyton</text><text class="s" x="277" y="276" text-anchor="middle">division/death timers</text><text class="s" x="277" y="293" text-anchor="middle">probabilistic fate</text><rect class="b c" x="410" y="63" width="145" height="86" rx="17"/><text class="t" x="482" y="97" text-anchor="middle">Simulation</text><text class="s" x="482" y="121" text-anchor="middle">individual-based</text><text class="s" x="482" y="138" text-anchor="middle">synthetic data</text><rect class="b g" x="410" y="230" width="145" height="86" rx="17"/><text class="t" x="482" y="263" text-anchor="middle">Inference</text><text class="s" x="482" y="287" text-anchor="middle">fit models</text><text class="s" x="482" y="304" text-anchor="middle">compare ARE</text><rect class="b p" x="610" y="130" width="135" height="118" rx="17"/><text class="t" x="677" y="165" text-anchor="middle">Next layer</text><text class="s" x="677" y="190" text-anchor="middle">stochastic master</text><text class="s" x="677" y="207" text-anchor="middle">equation</text><text class="s" x="677" y="224" text-anchor="middle">branching process</text><path class="arr" d="M152 128 H202"/><path class="arr" d="M152 128 C180 132 174 265 202 265"/><path class="arr" d="M350 90 H407"/><path class="arr" d="M350 266 H407"/><path class="arr" d="M555 106 C590 110 580 185 607 185"/><path class="arr" d="M555 273 C590 268 580 205 607 205"/></svg>